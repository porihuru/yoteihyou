<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予定表</title>
    <link rel="stylesheet" href="css/style.css">
    <style id="print-page-style" type="text/css"></style>
</head>
<body>
    <div id="app" class="app-shell">
        <div class="app-header">
            <h1 id="app-title">予定表</h1>
            <div class="source-switch" role="group" aria-label="データ接続先">
                <span class="source-label">データ接続：</span>
                <label><input type="radio" name="data-source" id="source-csv" value="csv"> 試験用CSV</label>
                <label><input type="radio" name="data-source" id="source-sharepoint" value="sharepoint"> SharePoint</label>
                <button type="button" id="reload-button" class="button button-small">再読込</button>
            </div>
            <div id="connection-status" class="connection-status" aria-live="polite">読込準備中</div>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="toolbar">
            <span class="view-switch">
                <button type="button" id="view-daily" class="button">日々</button>
                <button type="button" id="view-weekly" class="button">週間</button>
                <button type="button" id="view-monthly" class="button">月間</button>
            </span>
            <button type="button" id="previous-month" class="button">前月</button>
            <button type="button" id="current-month" class="button">今月</button>
            <button type="button" id="next-month" class="button">翌月</button>
            <span id="month-title" class="month-title"></span>
            <button type="button" id="print-view" class="button toolbar-right">印刷</button>
            <button type="button" id="new-event" class="button button-primary toolbar-right">予定を追加</button>
            <button type="button" id="open-settings" class="button toolbar-right">設定</button>
        </div>

        <div id="print-area" class="print-area">
            <div id="print-heading" class="print-heading"></div>

            <div id="monthly-view" class="calendar-wrap schedule-view">
            <table class="calendar organization-schedule monthly-schedule" aria-label="月間予定表">
                <thead id="monthly-head"></thead>
                <tbody id="calendar-body"></tbody>
            </table>
            </div>

            <div id="weekly-view" class="list-view schedule-view" style="display:none;">
            <table class="schedule-list organization-schedule weekly-schedule" aria-label="週間予定表">
                <thead id="weekly-head"></thead>
                <tbody id="weekly-body"></tbody>
            </table>
            </div>

            <div id="daily-view" class="list-view schedule-view" style="display:none;">
            <table class="schedule-list daily-list" aria-label="日々予定表">
                <thead>
                    <tr>
                        <th class="time-column">時刻</th>
                        <th>予定（空白の時間帯をクリックして入力）</th>
                    </tr>
                </thead>
                <tbody id="daily-body"></tbody>
            </table>
            </div>
        </div>

        <div id="event-editor" class="editor-panel" role="region" aria-labelledby="editor-title" style="display:none;">
            <h2 id="editor-title">予定を追加</h2>
            <form id="event-form">
                <input type="hidden" id="event-id" value="">
                <div class="form-row">
                    <label for="event-name">件名 <span class="required">必須</span></label>
                    <input type="text" id="event-name" maxlength="255">
                </div>
                <div class="form-row form-row-half">
                    <div>
                        <label for="start-date">開始日時 <span class="required">必須</span></label>
                        <input type="text" id="start-date" placeholder="2026-09-16 09:00">
                    </div>
                    <div>
                        <label for="end-date">終了日時</label>
                        <input type="text" id="end-date" placeholder="2026-09-16 10:00">
                    </div>
                </div>
                <div class="form-row checkbox-row output-targets">
                    <span class="form-label">反映先 <span class="required">必須</span></span>
                    <label><input type="checkbox" id="target-daily" checked> 日々</label>
                    <label><input type="checkbox" id="target-weekly" checked> 週間</label>
                    <label><input type="checkbox" id="target-monthly" checked> 月間</label>
                </div>
                <div class="form-row form-row-half">
                    <div>
                        <label for="organization-section">大グループ</label>
                        <select id="organization-section"></select>
                    </div>
                    <div>
                        <label for="organization-team">小グループ</label>
                        <select id="organization-team"></select>
                    </div>
                </div>
                <div class="form-row form-row-half">
                    <div>
                        <label for="category">区分</label>
                        <input type="text" id="category" maxlength="100">
                    </div>
                    <div>
                        <label for="location">場所</label>
                        <input type="text" id="location" maxlength="255">
                    </div>
                </div>
                <div class="form-row">
                    <label for="description">内容</label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="editor-actions">
                    <button type="submit" id="save-event" class="button button-primary">保存</button>
                    <button type="button" id="delete-event" class="button button-danger" style="display:none;">削除</button>
                    <button type="button" id="cancel-edit" class="button">取消</button>
                </div>
                <p id="csv-unsaved-note" class="readonly-note" style="display:none;">試験用CSVでの変更は画面上だけに反映されます。再読込・接続先切替・ページ終了で変更は消えます。</p>
            </form>
        </div>

        <div id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" style="display:none;">
            <div class="settings-header">
                <h2 id="settings-title">組織設定</h2>
                <button type="button" id="close-settings" class="button">閉じる</button>
            </div>
            <div id="settings-status" class="settings-status" aria-live="polite"></div>
            <div class="settings-actions">
                <button type="button" id="settings-new" class="button button-primary">新規設定</button>
                <button type="button" id="settings-reload" class="button">SharePointから再読込</button>
            </div>
            <div class="settings-table-wrap">
                <table class="settings-table">
                    <thead>
                        <tr>
                            <th>大グループ</th>
                            <th>小グループ</th>
                            <th>月間</th>
                            <th>週間</th>
                            <th>日々</th>
                            <th>順序</th>
                            <th>状態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="settings-body"></tbody>
                </table>
            </div>
            <form id="settings-form" class="settings-form">
                <h3 id="settings-form-title">設定を追加</h3>
                <input type="hidden" id="setting-id" value="">
                <div class="form-row form-row-half">
                    <div>
                        <label for="setting-group-name">大グループ <span class="required">必須</span></label>
                        <input type="text" id="setting-group-name" maxlength="100">
                    </div>
                    <div>
                        <label for="setting-team-name">小グループ</label>
                        <input type="text" id="setting-team-name" maxlength="100">
                    </div>
                </div>
                <div class="settings-number-row">
                    <div><label for="setting-monthly-rows">月間行数</label><input type="number" id="setting-monthly-rows" min="1" max="50" value="5"></div>
                    <div><label for="setting-weekly-rows">週間行数</label><input type="number" id="setting-weekly-rows" min="1" max="50" value="5"></div>
                    <div><label for="setting-daily-rows">日々行数</label><input type="number" id="setting-daily-rows" min="1" max="50" value="5"></div>
                    <div><label for="setting-sort-order">表示順</label><input type="number" id="setting-sort-order" value="0"></div>
                </div>
                <div class="form-row checkbox-row">
                    <label><input type="checkbox" id="setting-active" checked> 有効</label>
                </div>
                <div class="editor-actions">
                    <button type="submit" id="settings-save" class="button button-primary">保存</button>
                    <button type="button" id="settings-delete" class="button button-danger" style="display:none;">削除</button>
                    <button type="button" id="settings-cancel-edit" class="button">入力取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="config/organizations.js"></script>
    <script src="js/util.js"></script>
    <script src="js/csv-data-source.js"></script>
    <script src="js/sharepoint-data-source.js"></script>
    <script src="js/sharepoint-settings-data-source.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/settings-controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
